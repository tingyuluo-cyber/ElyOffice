name: ReimuMark Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build portable ZIP
        shell: pwsh
        run: ./packaging/windows/reimu-zip.ps1
      - name: Write SHA-256 checksum
        shell: pwsh
        run: |
          $package = Get-Item -Path 'dist/ReimuMark-*-windows-x64.zip'
          $hash = (Get-FileHash -LiteralPath $package.FullName).Hash.ToLowerInvariant()
          "$hash  $($package.Name)" | Set-Content -LiteralPath "$($package.FullName).sha256" -Encoding ascii
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ReimuMark-windows-x64
          path: |
            dist/ReimuMark-*-windows-x64.zip
            dist/ReimuMark-*-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
