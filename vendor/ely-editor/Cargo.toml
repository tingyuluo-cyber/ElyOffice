[package]
name = "ely-editor"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Ely's code editor for GPUI: text, highlighting, find, folds and the panels around them."
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"
readme = "README.md"

[features]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-core = { version = "0.3.0", default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5" }
ely-charts = { version = "0.2.0", git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5" }
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false }
log = "0.4"
regex = "1"
serde_json = "1"

[lints.clippy]
all = "warn"
