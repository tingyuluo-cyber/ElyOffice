[package]
name = "ely-documents"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Ely's document components for GPUI: Markdown read and written, block editing, math, diagrams and reading aids."
repository = "https://github.com/ELY-Open-Source/Ely-GPUI-Components"
homepage = "https://elygpui.com"
readme = "README.md"
keywords = ["gpui", "ui", "components", "widgets", "gui"]
categories = ["gui"]

[features]
test-support = ["ely-core/test-support", "gpui/test-support", "gpui/leak-detection"]

[dependencies]
ely-core = { version = "0.3.0", default-features = false, git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5" }
ely-editor = { version = "0.2.0", git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5" }
base64 = "0.22"
emojis = "0.9"
entities = "1"
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false }
image = { version = "0.25", default-features = false }
jiff = "0.2"
log = "0.4"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ratex-layout = "0.1.14"
ratex-parser = "0.1.14"
ratex-svg = { version = "0.1.14", features = ["embed-fonts"] }
ratex-types = "0.1.14"
regex = "1"
similar = { version = "3.2", default-features = false, features = ["std", "text", "inline", "unicode"] }
smallvec = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
usvg = "0.46"
web-time = "1.1"

[target.'cfg(target_family = "wasm")'.dependencies]
similar = { version = "3.2", default-features = false, features = ["wasm32_web_time"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", default-features = false, features = ["time"] }

[dev-dependencies]
ely-core = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", rev = "e0f355ac1a669c24336244bcaa8131f7f0e4f1b5", default-features = false, features = ["test-support"] }
gpui = { package = "gpui-pre", version = "=0.3.11", default-features = false, features = ["test-support", "leak-detection"] }


[lints.clippy]
all = "warn"

